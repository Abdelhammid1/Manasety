{% set arts = featured_articles(c.article_slugs, (c.count or '3')|int, lang) %}
{% if arts %}
<section class="section"{% if anchor %} id="{{ anchor }}"{% endif %}>
  <div class="wrap">
    <div class="head rv">
      {% if c.eyebrow %}<span class="pill">{{ c.eyebrow }}</span>{% endif %}
      <h2>{{ c.title|rt }}</h2>
    </div>
    <div class="grid g3">
      {% for a in arts %}{% include "public/_post_card.html" %}{% endfor %}
    </div>
    {% if c.more_label %}<p class="faq-more"><a href="{{ '/business/blog' if request.path.startswith('/business') else '/blog' }}">{{ c.more_label }}</a></p>{% endif %}
  </div>
</section>
{% endif %}
