<section class="section"{% if anchor %} id="{{ anchor }}"{% endif %}>
  <div class="wrap" style="max-width:860px">
    {% if c.title %}<h2 style="font-size:clamp(26px,3.4vw,36px)">{{ c.title|rt }}</h2>{% endif %}
    <div class="prose" style="border:0;padding:0;background:none">{{ c.body|rich }}</div>
    {% if c.cta_label %}<p style="margin-top:20px"><a class="btn btn-primary" href="{{ (c.cta_href or '#contact')|lhref }}">{{ c.cta_label }}</a></p>{% endif %}
  </div>
</section>
