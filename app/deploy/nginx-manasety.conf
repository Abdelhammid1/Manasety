# /etc/nginx/sites-available/manasety.ai
# Only the root domain changes. Subdomains (lms, school, qdrat, n8n, whatsapp, …) keep their own server blocks.
#
# ROLLBACK (spec "خطة الـ Rollback", minutes):
#   1. ln -sf /etc/nginx/snippets/manasety-legacy.conf /etc/nginx/snippets/manasety-active.conf
#   2. nginx -t && systemctl reload nginx
# The new app's database stays untouched for analysis.

server {
    listen 80;
    listen [::]:80;
    server_name manasety.ai www.manasety.ai;
    return 301 https://manasety.ai$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.manasety.ai;
    ssl_certificate     /etc/letsencrypt/live/manasety.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/manasety.ai/privkey.pem;
    return 301 https://manasety.ai$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name manasety.ai;
    ssl_certificate     /etc/letsencrypt/live/manasety.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/manasety.ai/privkey.pem;

    client_max_body_size 40m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    # Keep ownership-verification files working whichever version is live (e.g. google*.html, .well-known).
    location ^~ /.well-known/ { root /opt/manasety/legacy-site; try_files $uri =404; }

    include /etc/nginx/snippets/manasety-active.conf;   # → manasety-app.conf (new) or manasety-legacy.conf (old)
}
