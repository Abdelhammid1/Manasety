<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Happy Birthday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
  href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,600;1,700&family=Cairo:wght@400;600;700&display=swap"
  rel="stylesheet"
/>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="petals" id="petals"></div>

<main>

  <!-- ============ 1. HERO ============ -->
  <section class="screen page active" id="hero-screen">
    <div class="container">
      <div class="eyebrow" id="hero-eyebrow">A Special Day</div>
      <h1 class="title">Today is<br><em id="hero-name">Name's</em><br>Birthday</h1>
      <p class="subtitle" id="hero-subtitle">✨ Let the celebration begin</p>
      <button class="btn btn-primary" id="start-btn">ابدأ الكويز &nbsp;→</button>
    </div>
  </section>

  <!-- ============ 2. QUIZ ============ -->
  <section class="screen page" id="quiz-screen">
    <div class="container">
      <h2 class="quiz-head">
        <em>Quick Quiz</em> for <span id="quiz-title-name">Name</span>!
      </h2>
      <p class="quiz-sub" id="quiz-sub">جاوبي صح عشان تعدي</p>

      <div class="quiz-card">
        <div id="quiz-questions"></div>
        <button class="btn btn-primary" id="submit-btn" style="margin-top: 10px; width: 100%;">
          تأكيد الإجابات
        </button>
      </div>
    </div>
  </section>

  <!-- ============ 3. CELEBRATE ============ -->
  <section class="screen page" id="celebrate-screen">
    <div class="container">
      <div class="eyebrow" id="celebrate-eyebrow">✦ A Celebration ✦</div>
      <h1 class="title">
        <span id="celebrate-prefix">Let's Celebrate</span><br>
        <em id="celebrate-name">Name!</em>
      </h1>
      <button class="btn btn-outline celebrate-btn" id="celebrate-btn">CELEBRATE! 🎉</button>
    </div>
  </section>

  <!-- ============ 4-6. FINAL FLOW (scrolls together) ============ -->
  <div id="final-flow">

    <section class="screen" id="memories">
      <div class="container">
        <div class="eyebrow" id="memories-eyebrow">✦ Memories ✦</div>
        <h2 class="memories-title">
          <span id="memories-title-prefix">Our Beautiful Moments</span>
          <em id="memories-title-name" style="display:none"></em>
        </h2>
        <div class="memories-grid" id="memories-grid"></div>
      </div>
    </section>

    <!-- Letter -->
    <section class="screen" id="letter">
      <div class="container">
        <div style="text-align: right; direction: rtl;">
          <div class="letter-eyebrow" id="letter-eyebrow">✦ من القلب</div>
          <div class="letter-name" id="letter-name"></div>
          <div class="letter-line"></div>
          <p class="letter-ar" id="letter-ar"></p>
          <div class="letter-line"></div>
          <p class="letter-en" id="letter-en"></p>
          <div class="signature">
            <span id="signature-en">Yours ❤️</span>
            <span class="name" id="signature-ar"></span>
          </div>
        </div>
      </div>
    </section>

    <!-- Video -->
    <section class="screen" id="video-screen">
      <div class="container">
        <div class="eyebrow" id="video-eyebrow">✦ A Message ✦</div>
        <h2 class="memories-title" id="video-title">🎬 <em>Watch This</em></h2>
        <div class="video-wrap" id="video-container">
          <!-- template.js injects <video> or <iframe> here -->
        </div>
      </div>
    </section>

  </div><!-- /#final-flow -->

</main>

<!-- ============ WRONG-ANSWER MODAL ============ -->
<div class="modal-backdrop" id="wrong-modal">
  <div class="modal">
    <div class="emoji" id="wrong-emoji">😠</div>
    <div class="msg"   id="wrong-message">طب مفيش عيييد ميلاد 🎂</div>
    <button class="btn btn-primary" id="wrong-close-btn">حاولي تاني</button>
  </div>
</div>

<script type="module" src="js/template.js"></script>

</body>
</html>
